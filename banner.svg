<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="55%" stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <style>
      .top-tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #34d399; }
      .hero-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 40px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
      .hero-role { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .hero-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .pill-txt { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .pill-txt-hi { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .stat-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .gens-pill { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #f8fafc; }

      .orbit-cw { transform-origin: 735px 145px; animation: rotCW 20s linear infinite; }
      .orbit-ccw { transform-origin: 735px 145px; animation: rotCCW 14s linear infinite; }
      .steam-a { animation: steamUp 2.6s ease-in-out infinite; }
      .steam-b { animation: steamUp 2.6s ease-in-out 0.8s infinite; }
      .steam-c { animation: steamUp 2.6s ease-in-out 1.6s infinite; }
      .node-blink { animation: blinkNode 3.2s ease-in-out infinite; }
      .node-blink-2 { animation: blinkNode 3.2s ease-in-out 1.6s infinite; }

      @keyframes rotCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes rotCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes steamUp {
        0%, 100% { transform: translateY(0px); opacity: 0.35; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      @keyframes blinkNode {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="316" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.16">
    <line x1="510" y1="35" x2="585" y2="75"/>
    <line x1="585" y1="75" x2="640" y2="40"/>
    <line x1="585" y1="75" x2="560" y2="150"/>
    <line x1="560" y1="150" x2="625" y2="215"/>
    <line x1="560" y1="150" x2="495" y2="210"/>
    <line x1="625" y1="215" x2="575" y2="280"/>
    <line x1="820" y1="45" x2="865" y2="105"/>
    <line x1="865" y1="105" x2="845" y2="225"/>
    <line x1="845" y1="225" x2="795" y2="285"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="510" cy="35" r="2.5" class="node-blink"/>
    <circle cx="585" cy="75" r="3" class="node-blink-2"/>
    <circle cx="640" cy="40" r="2" class="node-blink"/>
    <circle cx="560" cy="150" r="3" class="node-blink"/>
    <circle cx="625" cy="215" r="2.5" class="node-blink-2"/>
    <circle cx="495" cy="210" r="2" class="node-blink"/>
    <circle cx="575" cy="280" r="2.5" class="node-blink-2"/>
    <circle cx="820" cy="45" r="2.5" class="node-blink"/>
    <circle cx="865" cy="105" r="3" class="node-blink-2"/>
    <circle cx="845" cy="225" r="2.5" class="node-blink"/>
    <circle cx="795" cy="285" r="2" class="node-blink-2"/>
  </g>

  <circle cx="735" cy="145" r="145" fill="url(#glowRight)"/>

  <rect x="44" y="28" width="258" height="24" rx="12" fill="#0f292e" stroke="#134e4a" stroke-width="1"/>
  <circle cx="58" cy="40" r="3.5" fill="#10b981"/>
  <text x="70" y="44" class="top-tag">Backend &amp; Full Stack Software Engineer</text>

  <text x="44" y="94" class="hero-name">Georgio Sampaio</text>
  <text x="44" y="120" class="hero-role">Software Engineering • Java &amp; Spring Boot Ecosystem</text>
  <text x="44" y="141" class="hero-sub">Founder @ GENS Systems • Cloud, APIs &amp; AI-Assisted Engineering</text>

  <g transform="translate(44, 158)">
    <rect x="0" y="0" width="76" height="25" rx="12.5" fill="#131c31" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="14" cy="12.5" r="3" fill="#f97316"/>
    <text x="24" y="16" class="pill-txt-hi">Java</text>

    <rect x="84" y="0" width="112" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="98" cy="12.5" r="3" fill="#10b981"/>
    <text x="108" y="16" class="pill-txt">Spring Boot</text>

    <rect x="204" y="0" width="92" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="218" cy="12.5" r="3" fill="#84cc16"/>
    <text x="228" y="16" class="pill-txt">Swagger</text>

    <rect x="304" y="0" width="92" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="318" cy="12.5" r="3" fill="#fb7185"/>
    <text x="328" y="16" class="pill-txt">Postman</text>
  </g>

  <g transform="translate(44, 191)">
    <rect x="0" y="0" width="84" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="14" cy="12.5" r="3" fill="#38bdf8"/>
    <text x="24" y="16" class="pill-txt">Docker</text>

    <rect x="92" y="0" width="106" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="106" cy="12.5" r="3" fill="#60a5fa"/>
    <text x="116" y="16" class="pill-txt">Kubernetes</text>

    <rect x="206" y="0" width="118" height="25" rx="12.5" fill="#131c31" stroke="#10b981" stroke-width="1"/>
    <circle cx="220" cy="12.5" r="3" fill="#fbbf24"/>
    <text x="230" y="16" class="pill-txt-hi">AWS &amp; Azure</text>

    <rect x="332" y="0" width="128" height="25" rx="12.5" fill="#131c31" stroke="#26334d" stroke-width="1"/>
    <circle cx="346" cy="12.5" r="3" fill="#a855f7"/>
    <text x="356" y="16" class="pill-txt">Claude &amp; Codex</text>
  </g>

  <g transform="translate(44, 238)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#1e1b18" stroke="#f97316" stroke-width="1.2"/>
    <text x="16" y="21" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#f97316">25+</text>
    <text x="42" y="16" class="stat-val">Years in Tech</text>
    <text x="42" y="31" class="stat-lbl">Systems &amp; Hardware (1999)</text>

    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#0f292e" stroke="#10b981" stroke-width="1.2"/>
      <text x="16" y="21" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#10b981">5y</text>
      <text x="42" y="16" class="stat-val">Instructor</text>
      <text x="42" y="31" class="stat-lbl">Delphi Programming</text>
    </g>

    <g transform="translate(362, 0)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#111d35" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="16" y="20" text-anchor="middle" font-family="monospace" font-size="11" font-weight="800" fill="#38bdf8">{ }</text>
      <text x="42" y="16" class="stat-val">Java &amp; Cloud</text>
      <text x="42" y="31" class="stat-lbl">Spring, AWS &amp; Azure</text>
    </g>
  </g>

  <circle cx="735" cy="145" r="92" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>
  <circle cx="735" cy="145" r="84" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="14 8" class="orbit-cw"/>
  <circle cx="735" cy="145" r="68" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 10" opacity="0.6" class="orbit-ccw"/>

  <g class="orbit-cw">
    <circle cx="735" cy="145" r="84" fill="none"/>
    <circle cx="735" cy="61" r="5" fill="#f97316"/>
    <circle cx="819" cy="145" r="4.5" fill="#10b981"/>
    <circle cx="651" cy="145" r="4.5" fill="#38bdf8"/>
  </g>

  <circle cx="735" cy="145" r="56" fill="#0f1b33" stroke="#26334d" stroke-width="1.5"/>

  <path d="M722 114 C718 105, 728 100, 724 91" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" class="steam-a"/>
  <path d="M735 112 C731 103, 741 98, 737 89" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" class="steam-b"/>
  <path d="M748 114 C744 105, 754 100, 750 91" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" class="steam-c"/>

  <path d="M712 123 H754 V145 C754 157, 744 165, 733 165 C722 165, 712 157, 712 145 Z" fill="#132342" stroke="#f8fafc" stroke-width="2.3"/>
  <path d="M754 129 H762 C767 129, 770 133, 770 138 C770 143, 767 147, 762 147 H754" fill="none" stroke="#f8fafc" stroke-width="2.3"/>
  <path d="M706 172 Q733 178 762 172" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <text x="735" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1.5">JAVA</text>

  <rect x="665" y="226" width="140" height="26" rx="13" fill="#0d172a" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="681" cy="239" r="3.5" fill="#10b981"/>
  <text x="742" y="243" text-anchor="middle" class="gens-pill">GENS Systems</text>
</svg>
