<svg width="100%" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="55%" stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <style>
      .top-tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #34d399; }
      .hero-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 40px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
      .hero-role { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .hero-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .pill-txt { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .pill-txt-hi { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .stat-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .gens-pill { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #f8fafc; }

      .orbit-cw { transform-origin: 735px 145px; animation: rotCW 20s linear infinite; }
      .orbit-ccw { transform-origin: 735px 145px; animation: rotCCW 14s linear infinite; }
      .steam-a { animation: steamUp 2.6s ease-in-out infinite; }
      .steam-b { animation: steamUp 2.6s ease-in-out 0.8s infinite; }
      .steam-c { animation: steamUp 2.6s ease-in-out 1.6s infinite; }
      .node-blink { animation: blinkNode 3.2s ease-in-out infinite; }
      .node-blink-2 { animation: blinkNode 3.2s ease-in-out 1.6s infinite; }

      @keyframes rotCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes rotCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes steamUp {
        0%, 100% { transform: translateY(0px); opacity: 0.35; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      @keyframes blinkNode {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="316" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.16">
    <line x1="510" y1="35" x2="585" y2="75"/>
    <line x1="585" y1="75" x2="640" y2="40"/>
    <line x1="585" y1="75" x2="560" y2="150"/>
    <line x1="560" y1="150" x2="625" y2="215"/>
    <line x1="560" y1="150" x2="495" y2="210"/>
    <line x1="625" y1="215" x2="575" y2="280"/>
    <line x1="820" y1="45" x2="865" y2="105"/>
    <line x1="865" y1="105" x2="845" y2="225"/>
    <line x1="845" y1="225" x2="795" y2="285"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="510" cy="35" r="2.5" class="node-blink"/>
    <circle cx="585" cy="75" r="3" class="node-blink-2"/>
    <circle cx="640" cy="40" r="2" class="node-blink"/>
    <circle cx="560" cy="150" r="3" class="node-blink"/>
    <circle cx="625" cy="215" r="2.5" class="node-blink-2"/>
    <circle cx="495" cy="210" r="2" class="node-blink"/>
    <circle cx="575" cy="280" r="2.5" class="node-blink-2"/>
    <circle cx="820" cy="45" r="2.5" class="node-blink"/>
    <circle cx="865" cy="105" r="3" class="node-blink-2"/>
    <circle cx="845" cy="225" r="2.5" class="node-blink"/>
    <circle cx="795" cy="285" r="2" class="node-blink-2"/>
  </g>

  <circle cx="735" cy="145" r="145" fill="url(#glowRight)"/>

  <rect x="44" y="28" width="258" height="24" rx="12" fill="#0f292e" stroke="#134e4a" stroke-width="1"/>
  <circle cx="58" cy="40" r="3.5" fill="#10b981"/>
  <text x="70" y="44" class="top-tag">Backend &amp; Full Stack Software Engineer</text>

  <text x="44" y="94" class="hero-name">Georgio Sampaio</text>
  <text x="44" y="120" class="hero-role">Software Engineering • Java &amp; Spring Boot Ecosystem</text>
  <text x="44" y="141" class="hero-sub">Founder @ GENS Systems • Cloud, APIs &amp; AI-Assisted Engineering</text>

