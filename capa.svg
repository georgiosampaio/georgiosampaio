<svg xmlns="http://www.w3.org/2000/svg"
     width="240" height="240"
     viewBox="0 0 240 240"
     role="img"
     aria-label="Xícara de café animada">

  <defs>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="18" fill="#0b1324"/>
  <circle cx="120" cy="120" r="112" fill="url(#glow)"/>
  <circle cx="120" cy="120" r="102" fill="none"
          stroke="#1e293b" stroke-width="2"/>

  <g>
    <circle cx="120" cy="120" r="94" fill="none"
            stroke="url(#ringGradient)" stroke-width="3"
            stroke-dasharray="16 10"/>
    <circle cx="120" cy="26" r="6" fill="#f97316"/>
    <circle cx="214" cy="120" r="5.5" fill="#10b981"/>
    <circle cx="26" cy="120" r="5.5" fill="#38bdf8"/>

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 120 120"
                      to="360 120 120"
                      dur="20s"
                      repeatCount="indefinite"/>
  </g>

  <circle cx="120" cy="120" r="78" fill="none"
          stroke="#38bdf8" stroke-width="1.5"
          stroke-dasharray="8 12" opacity="0.7">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="360 120 120"
                      to="0 120 120"
                      dur="14s"
                      repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="120" r="66"
          fill="#0f1b33" stroke="#26334d" stroke-width="2"/>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M106 84 C101 72 114 66 109 54" stroke="#f97316">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -7;0 0"
                        dur="2.6s"
                        repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.35;1;0.35"
               dur="2.6s"
               repeatCount="indefinite"/>
    </path>

    <path d="M120 82 C115 70 128 63 123 51" stroke="#38bdf8">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 -7;0 0;0 -7"
                        dur="2.6s"
                        repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;0.35;1"
               dur="2.6s"
               repeatCount="indefinite"/>
    </path>

    <path d="M134 84 C129 72 142 66 137 54" stroke="#10b981">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -7;0 0"
                        dur="2.6s"
                        repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.35;1;0.35"
               dur="2.6s"
               repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <path d="M93 95 H147 V126
             C147 144 135 154 120 154
             C105 154 93 144 93 126 Z"
          fill="#132342" stroke="#f8fafc" stroke-width="3"/>

    <path d="M147 103 H157
             C165 103 170 109 170 116
             C170 123 165 129 157 129 H147"
          fill="none" stroke="#f8fafc" stroke-width="3"/>

    <path d="M85 165 Q120 174 155 165"
          fill="none" stroke="#f97316"
          stroke-width="3" stroke-linecap="round"/>

    <text x="120" y="187"
          text-anchor="middle"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="12"
          font-weight="800"
          fill="#38bdf8"
          letter-spacing="2">JAVA</text>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0;0 -3;0 0"
                      dur="2.6s"
                      repeatCount="indefinite"/>
  </g>
</svg>
