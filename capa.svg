<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Capa profissional animada de Georgio Sampaio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#0d1528"/>
      <stop offset="1" stop-color="#0a192f"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <style>
      .steam-1, .steam-2, .steam-3 {
        transform-box: fill-box;
        transform-origin: center;
        animation: steamRise 2.6s ease-in-out infinite;
      }
      .steam-2 {
        animation-delay: -0.9s;
      }
      .steam-3 {
        animation-delay: -1.7s;
      }
      .java-cup {
        transform-box: fill-box;
        transform-origin: center;
        animation: cupBob 2.6s ease-in-out infinite;
      }
      @keyframes steamRise {
        0%, 100% {
          transform: translateY(2px);
          opacity: 0.35;
        }
        50% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      @keyframes cupBob {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-2.5px);
        }
      }
    </style>
  </defs>

